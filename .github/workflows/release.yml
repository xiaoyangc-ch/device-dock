name: Build Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run pack:mac:adhoc
      - name: Verify DMG
        run: hdiutil verify release/**/*-adhoc.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: device-dock-macos
          path: release/**/*-adhoc.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: device-dock-windows
          path: |
            release/**/*.exe
            release/**/*.zip
            !release/**/win-unpacked/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - run: gh release create "$GITHUB_REF_NAME" artifacts/**/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
