name: Build Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Android server
        run: ./server/gradlew -p server :server:assembleRelease
      - name: Verify committed device dex
        run: |
          cp server/devicedock.dex resources/devicedock.dex
          git diff --exit-code -- resources/devicedock.dex

  mac:
    needs: [quality, android]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run pack:mac:adhoc
      - name: Verify DMG
        run: hdiutil verify release/**/*-adhoc.dmg
      - uses: actions/upload-artifact@v5
        with:
          name: device-dock-macos
          path: release/**/*-adhoc.dmg
          if-no-files-found: error

  windows:
    needs: [quality, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run build
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: device-dock-windows
          path: |
            release/**/*.exe
            release/**/*.zip
            !release/**/win-unpacked/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, android, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Build checksums
        run: |
          find artifacts -type f ! -name SHA256SUMS.txt -print0 |
            while IFS= read -r -d '' file; do
              sha256sum "$file" | sed "s#  .*#  $(basename "$file")#"
            done > artifacts/SHA256SUMS.txt
      - name: Publish or update release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; uploading replacement artifacts"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          find artifacts -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
