name: Build Windows

# 手动触发：Actions → Build Windows → Run workflow，跑完在 Artifacts 下载 exe
on:
  workflow_dispatch:

jobs:
  win:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm 10 不拦截 postinstall；--legacy-peer-deps 是本仓库必需
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build main / preload / renderer
        run: npm run build

      - name: Pack NSIS installer
        run: npm run pack
        env:
          # 不签名、不发布
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 设备坞-win-x64
          # 只要 NSIS 安装包，win-unpacked 里那个大 exe 别塞进 artifact
          path: |
            release/**/*.exe
            !release/**/win-unpacked/**
          if-no-files-found: error
