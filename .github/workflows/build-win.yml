name: Build Windows

# 手动触发：Actions → Build Windows → Run workflow，跑完在 Artifacts 下载 exe
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build Android server
        run: ./server/gradlew -p server :server:assembleRelease

  win:
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # --legacy-peer-deps 是本仓库必需；npm ci 保证和 lockfile 一致
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build main / preload / renderer
        run: npm run build

      - name: Pack NSIS installer
        run: npm run pack
        env:
          # 不签名、不发布
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 设备坞-win-x64
          # 只要 NSIS 安装包，win-unpacked 里那个大 exe 别塞进 artifact
          path: |
            release/**/*.exe
            !release/**/win-unpacked/**
          if-no-files-found: error
