plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.protobuf'
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:3.22.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}

android {
    namespace 'com.devicedock.server'

    compileSdk = 34

    def pkgFilePath = "$rootDir/../package.json"
    def pkgFile = new File(pkgFilePath)
    def pkgJson = new groovy.json.JsonSlurper().parseText(pkgFile.text)
    def versionMatch = (pkgJson.version =~ /^(\d+)\.(\d+)\.(\d+)/)
    if (!versionMatch.find()) {
        throw new GradleException("package.json version must start with major.minor.patch")
    }
    def appVersionCode = versionMatch.group(1).toInteger() * 10000 +
        versionMatch.group(2).toInteger() * 100 +
        versionMatch.group(3).toInteger()

    defaultConfig {
        minSdk 23
        versionCode appVersionCode
        versionName pkgJson.version
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "devicedock-server-v${versionName}.apk"

        def dexPath = rootProject.rootDir.path
        variant.assembleProvider.get().doLast {
            copy {
                def file = zipTree(file(outputFile)).matching { include 'classes*.dex' }.singleFile

                from file
                into dexPath
                rename { String fileName ->
                    fileName.replace(file.getName(), "devicedock.dex")
                }
            }
        }
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.22.3'
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}
